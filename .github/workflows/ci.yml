# CI: lint + typecheck + build on every PR and push to main (no deploy, no real secrets).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is built by deploy.yml, which calls this workflow first
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only; nothing connects to them.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      SHADOW_DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_shadow
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci            # postinstall runs prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
